# Apply with: kubectl apply -f k8s/
# Create the secret first (see secret.example.yaml); images must be pushed to your registry and the `image:` values below updated.
apiVersion: v1
kind: Namespace
metadata:
  name: rimss
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rimss-api
  namespace: rimss
spec:
  replicas: 2
  selector:
    matchLabels: { app: rimss-api }
  template:
    metadata:
      labels: { app: rimss-api }
    spec:
      containers:
        - name: api
          image: rimss-api:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: '4000'
            - name: CORS_ORIGINS
              value: https://rimss.example.com
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: rimss-secrets, key: DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: rimss-secrets, key: JWT_SECRET } }
            - name: ADMIN_API_KEY
              valueFrom: { secretKeyRef: { name: rimss-secrets, key: ADMIN_API_KEY } }
            - name: VAPID_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: rimss-secrets, key: VAPID_PUBLIC_KEY } }
            - name: VAPID_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: rimss-secrets, key: VAPID_PRIVATE_KEY } }
          readinessProbe:
            httpGet: { path: /api/ready, port: 4000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  # Named `api` because rimss-app/nginx.conf proxies /api to http://api:4000.
  name: api
  namespace: rimss
spec:
  selector: { app: rimss-api }
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rimss-app
  namespace: rimss
spec:
  replicas: 2
  selector:
    matchLabels: { app: rimss-app }
  template:
    metadata:
      labels: { app: rimss-app }
    spec:
      containers:
        - name: web
          image: rimss-app:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: rimss-app
  namespace: rimss
spec:
  selector: { app: rimss-app }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rimss
  namespace: rimss
spec:
  rules:
    - host: rimss.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: rimss-app, port: { number: 80 } } }
