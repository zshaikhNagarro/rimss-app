server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # expires (not add_header) so the server-level security headers are still inherited.
  # Hashed assets are immutable; the service worker and entry HTML must revalidate.
  location /assets/ {
    expires 1y;
  }

  location = /index.html {
    expires -1;
  }

  location ~ ^/(sw\.js|push-sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    expires -1;
  }

  # SPA fallback for client-side routes.
  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
